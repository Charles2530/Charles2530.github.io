<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">数据分布沿已知加噪路径变成近似高斯分布</title>
  <desc id="desc">三个面板分别展示多峰数据分布、中间带噪分布和近似高斯分布。箭头表示已知加噪过程，图形描述边缘分布变化，不表示点之间存在唯一反向配对。</desc>
  <defs>
    <style>
      .panel{fill:#f7faf9;stroke:#4d7c75;stroke-width:2}.axis{stroke:#9db5b0;stroke-width:1}.label{font:600 22px system-ui,sans-serif;fill:#193a35}.note{font:16px system-ui,sans-serif;fill:#47645f}.point-a{fill:#0f766e}.point-b{fill:#ea580c}.point-c{fill:#64748b}.arrow{stroke:#4d7c75;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4d7c75"/></marker>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <g transform="translate(35 45)">
    <rect class="panel" width="320" height="285" rx="16"/>
    <line class="axis" x1="35" y1="245" x2="290" y2="245"/><line class="axis" x1="55" y1="265" x2="55" y2="35"/>
    <text class="label" x="160" y="-12" text-anchor="middle">真实数据分布 p_data</text>
    <g class="point-a"><circle cx="104" cy="86" r="7"/><circle cx="126" cy="70" r="7"/><circle cx="139" cy="96" r="7"/><circle cx="113" cy="112" r="7"/><circle cx="151" cy="121" r="7"/><circle cx="88" cy="126" r="7"/></g>
    <g class="point-b"><circle cx="215" cy="180" r="7"/><circle cx="238" cy="162" r="7"/><circle cx="252" cy="190" r="7"/><circle cx="226" cy="207" r="7"/><circle cx="267" cy="216" r="7"/><circle cx="198" cy="220" r="7"/></g>
    <text class="note" x="160" y="276" text-anchor="middle">多峰结构清晰</text>
  </g>
  <path class="arrow" d="M370 190 C410 150 430 150 470 190"/>
  <text class="note" x="420" y="135" text-anchor="middle">增加噪声</text>
  <g transform="translate(475 45)">
    <rect class="panel" width="320" height="285" rx="16"/>
    <line class="axis" x1="35" y1="245" x2="290" y2="245"/><line class="axis" x1="55" y1="265" x2="55" y2="35"/>
    <text class="label" x="160" y="-12" text-anchor="middle">中间带噪分布 p_t</text>
    <g class="point-a" opacity=".74"><circle cx="95" cy="72" r="7"/><circle cx="139" cy="62" r="7"/><circle cx="166" cy="105" r="7"/><circle cx="105" cy="132" r="7"/><circle cx="178" cy="145" r="7"/><circle cx="77" cy="164" r="7"/></g>
    <g class="point-b" opacity=".74"><circle cx="196" cy="143" r="7"/><circle cx="248" cy="130" r="7"/><circle cx="274" cy="180" r="7"/><circle cx="210" cy="205" r="7"/><circle cx="250" cy="230" r="7"/><circle cx="165" cy="225" r="7"/></g>
    <g class="point-c" opacity=".45"><circle cx="151" cy="178" r="6"/><circle cx="205" cy="91" r="6"/><circle cx="130" cy="212" r="6"/><circle cx="228" cy="74" r="6"/></g>
    <text class="note" x="160" y="276" text-anchor="middle">峰逐渐重叠，密度被平滑</text>
  </g>
  <path class="arrow" d="M810 190 C850 150 870 150 910 190"/>
  <text class="note" x="860" y="135" text-anchor="middle">继续增加噪声</text>
  <g transform="translate(915 45)">
    <rect class="panel" width="250" height="285" rx="16"/>
    <line class="axis" x1="25" y1="245" x2="225" y2="245"/><line class="axis" x1="45" y1="265" x2="45" y2="35"/>
    <text class="label" x="125" y="-12" text-anchor="middle">近似高斯 p_T</text>
    <g class="point-c" opacity=".78"><circle cx="126" cy="55" r="6"/><circle cx="90" cy="75" r="6"/><circle cx="165" cy="82" r="6"/><circle cx="66" cy="112" r="6"/><circle cx="132" cy="110" r="6"/><circle cx="191" cy="119" r="6"/><circle cx="101" cy="144" r="6"/><circle cx="156" cy="154" r="6"/><circle cx="52" cy="174" r="6"/><circle cx="120" cy="186" r="6"/><circle cx="203" cy="184" r="6"/><circle cx="82" cy="218" r="6"/><circle cx="171" cy="221" r="6"/></g>
    <text class="note" x="125" y="276" text-anchor="middle">简单、易采样</text>
  </g>
  <text class="note" x="600" y="390" text-anchor="middle">箭头表示人为规定的前向加噪；学习任务是获得反向生成所需的局部信息</text>
</svg>
