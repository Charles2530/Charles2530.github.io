<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">DDPM data and noise coefficients</title>
  <desc id="desc">A clean schematic showing x_t as the sum of a data component sqrt(alpha_t) x_0 and a noise component sqrt(beta_t) epsilon on orthogonal axes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#176d87"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
  </defs>
  <rect width="920" height="620" fill="#ffffff"/>
  <g transform="translate(138 72)">
    <line x1="0" y1="460" x2="690" y2="460" stroke="#176d87" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="0" y1="460" x2="0" y2="20" stroke="#176d87" stroke-width="5" marker-end="url(#arrow)"/>

    <path d="M0,120 A340,340 0 0 1 340,460" fill="none" stroke="#176d87" stroke-width="5"/>
    <line x1="0" y1="460" x2="258" y2="202" stroke="#176d87" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="0" y1="202" x2="258" y2="202" stroke="#176d87" stroke-width="4" stroke-dasharray="12 9"/>
    <line x1="258" y1="460" x2="258" y2="202" stroke="#176d87" stroke-width="4" stroke-dasharray="12 9"/>

    <circle cx="258" cy="202" r="7" fill="#176d87"/>

    <text x="-54" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#111">x₀</text>
    <text x="292" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#111">xₜ</text>
    <text x="631" y="505" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#111">ε</text>

    <text x="-132" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#111">√αₜ x₀</text>
    <text x="198" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#111">√βₜ ε</text>

    <text x="382" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#263238">数据系数变小</text>
    <text x="382" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#263238">噪声系数变大</text>
    <path d="M372,380 C310,414 256,435 204,450" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrowDark)"/>
  </g>
</svg>
