<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">DDIM deterministic step geometry</title>
  <desc id="desc">A clean schematic showing a deterministic DDIM step from x_t to x_t prime by removing predicted noise, rescaling the data component, and recombining with a lower noise coefficient.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#176d87"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d71f1f"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#82bf45"/>
    </marker>
  </defs>
  <rect width="980" height="650" fill="#ffffff"/>
  <g transform="translate(130 80)">
    <line x1="0" y1="480" x2="720" y2="480" stroke="#176d87" stroke-width="5" marker-end="url(#axisArrow)"/>
    <line x1="0" y1="480" x2="0" y2="18" stroke="#176d87" stroke-width="5" marker-end="url(#axisArrow)"/>
    <path d="M0,140 A340,340 0 0 1 340,480" fill="none" stroke="#176d87" stroke-width="5"/>

    <!-- points: t' is less noisy than t -->
    <line x1="0" y1="244" x2="228" y2="244" stroke="#176d87" stroke-width="4" stroke-dasharray="12 9"/>
    <line x1="228" y1="480" x2="228" y2="244" stroke="#82bf45" stroke-width="4" stroke-dasharray="12 9"/>
    <line x1="0" y1="285" x2="279" y2="285" stroke="#176d87" stroke-width="4" stroke-dasharray="12 9"/>
    <line x1="279" y1="480" x2="279" y2="285" stroke="#d71f1f" stroke-width="4" stroke-dasharray="12 9"/>

    <line x1="0" y1="480" x2="279" y2="285" stroke="#176d87" stroke-width="5"/>
    <line x1="0" y1="480" x2="228" y2="244" stroke="#176d87" stroke-width="5"/>
    <circle cx="279" cy="285" r="7" fill="#d71f1f"/>
    <circle cx="228" cy="244" r="7" fill="#82bf45"/>

    <!-- remove old predicted noise from x_t -->
    <line x1="279" y1="285" x2="12" y2="285" stroke="#d71f1f" stroke-width="5" marker-end="url(#redArrow)"/>
    <!-- recombine at lower noise level -->
    <line x1="0" y1="244" x2="214" y2="244" stroke="#82bf45" stroke-width="5" marker-end="url(#greenArrow)"/>
    <path d="M42,284 C76,262 112,250 150,246" fill="none" stroke="#82bf45" stroke-width="4" marker-end="url(#greenArrow)"/>

    <text x="-54" y="137" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#111">x₀</text>
    <text x="306" y="293" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#111">xₜ</text>
    <text x="246" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#111">xₜ′</text>
    <text x="650" y="525" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#111">ε̂</text>

    <text x="-130" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#111">√ᾱₜ′ x̂₀</text>
    <text x="-122" y="293" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#111">√ᾱₜ x̂₀</text>
    <text x="193" y="534" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#111">√(1−ᾱₜ′) ε̂</text>
    <text x="305" y="534" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#111">√(1−ᾱₜ) ε̂</text>

    <text x="390" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#d71f1f">先减掉当前噪声分量</text>
    <text x="390" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#d71f1f">xₜ − √(1−ᾱₜ) ε̂</text>
    <text x="390" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#82bf45">再按 t′ 的系数组合</text>
    <text x="390" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#82bf45">√ᾱₜ′ x̂₀ + √(1−ᾱₜ′) ε̂</text>
  </g>
</svg>
