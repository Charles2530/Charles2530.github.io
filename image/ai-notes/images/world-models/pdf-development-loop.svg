<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">World model development loop</title>
  <desc id="desc">A world model development loop from data schema to geometry encoder, action-conditioned model, simulation evaluation, and data flywheel.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#28756f"/>
    </marker>
    <style>
      .bg { fill: #f7fbfa; }
      .box { fill: #ffffff; stroke: #28756f; stroke-width: 2; rx: 14; }
      .accent { fill: #fff7ed; stroke: #d97706; stroke-width: 2; rx: 14; }
      .title { font: 700 21px Arial, sans-serif; fill: #12312f; }
      .small { font: 14px Arial, sans-serif; fill: #31514e; }
      .tiny { font: 12px Arial, sans-serif; fill: #566b68; }
      .arrow { stroke: #28756f; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #d97706; stroke-width: 2.4; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="520" rx="24"/>
  <text class="title" x="48" y="46">World Model Engineering Loop</text>
  <text class="small" x="48" y="73">The PDF materials converge on one practical path: schema first, then geometry, action consequence prediction, simulation checks, and data feedback.</text>

  <rect class="box" x="48" y="126" width="184" height="112"/>
  <text class="title" x="72" y="158">Data Schema</text>
  <text class="small" x="72" y="187">camera pose</text>
  <text class="small" x="72" y="210">robot state</text>
  <text class="small" x="72" y="233">seam / object GT</text>

  <rect class="box" x="296" y="126" width="184" height="112"/>
  <text class="title" x="320" y="158">3D Encoder</text>
  <text class="small" x="320" y="187">depth / point map</text>
  <text class="small" x="320" y="210">camera / scale</text>
  <text class="small" x="320" y="233">visibility state</text>

  <rect class="box" x="544" y="126" width="210" height="112"/>
  <text class="title" x="568" y="158">Action Model</text>
  <text class="small" x="568" y="187">trajectory candidate</text>
  <text class="small" x="568" y="210">future state / risk</text>
  <text class="small" x="568" y="233">coverage reward</text>

  <rect class="box" x="820" y="126" width="220" height="112"/>
  <text class="title" x="844" y="158">Simulation Eval</text>
  <text class="small" x="844" y="187">RoboTwin / Isaac Sim</text>
  <text class="small" x="844" y="210">success checker</text>
  <text class="small" x="844" y="233">collision / contact</text>

  <path class="arrow" d="M232 182 H292"/>
  <path class="arrow" d="M480 182 H540"/>
  <path class="arrow" d="M754 182 H816"/>

  <rect class="accent" x="250" y="332" width="620" height="106"/>
  <text class="title" x="278" y="365">Data Flywheel</text>
  <text class="small" x="278" y="394">near-miss, invalid samples, planner failures, occlusion cases, wrong success checks</text>
  <text class="tiny" x="278" y="420">Use failures as structured supervision, not discarded noise.</text>

  <path class="dash" d="M930 238 C930 304 838 344 870 386"/>
  <path class="dash" d="M250 386 C152 386 140 296 140 242"/>
  <path class="arrow" d="M560 332 C560 286 648 270 648 242"/>

  <text class="tiny" x="67" y="289">Common blocker: field mismatch</text>
  <text class="tiny" x="67" y="307">cam_pose_list vs cam_pos_list</text>
  <text class="tiny" x="326" y="289">Common blocker: scale drift</text>
  <text class="tiny" x="580" y="289">Common blocker: action-insensitive future</text>
  <text class="tiny" x="838" y="289">Common blocker: final-state-only metric</text>
</svg>
