<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Embodied AI VLA data model evaluation flywheel</title>
  <desc id="desc">A VLA development flywheel from heterogeneous data to task-state-aware policy, robot execution, failure recovery, and recipe update.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .box { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .warm { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
      .title { font: 700 21px Arial, sans-serif; fill: #2e1f48; }
      .small { font: 14px Arial, sans-serif; fill: #4b3b63; }
      .tiny { font: 12px Arial, sans-serif; fill: #675f72; }
      .arrow { stroke: #7c3aed; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #ea580c; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1120" height="540" rx="24"/>
  <text class="title" x="48" y="48">Embodied AI / VLA Flywheel</text>
  <text class="small" x="48" y="76">The embodied PDF points to a system loop: data recipe, task-state-aware action generation, real execution, failure recovery, and recipe update.</text>

  <rect class="box" x="54" y="128" width="210" height="120"/>
  <text class="title" x="82" y="160">Data Recipe</text>
  <text class="small" x="82" y="190">web + robot data</text>
  <text class="small" x="82" y="214">human / VR traces</text>
  <text class="small" x="82" y="238">dirty + invalid cases</text>

  <rect class="box" x="324" y="128" width="220" height="120"/>
  <text class="title" x="352" y="160">VLA Policy</text>
  <text class="small" x="352" y="190">high-level subtask</text>
  <text class="small" x="352" y="214">action chunk / EEF</text>
  <text class="small" x="352" y="238">flow / diffusion head</text>

  <rect class="green" x="604" y="128" width="220" height="120"/>
  <text class="title" x="632" y="160">Task State</text>
  <text class="small" x="632" y="190">in progress</text>
  <text class="small" x="632" y="214">terminate</text>
  <text class="small" x="632" y="238">invalid / refuse</text>

  <rect class="box" x="884" y="128" width="190" height="120"/>
  <text class="title" x="912" y="160">Robot Rollout</text>
  <text class="small" x="912" y="190">controller</text>
  <text class="small" x="912" y="214">contact / safety</text>
  <text class="small" x="912" y="238">real feedback</text>

  <path class="arrow" d="M264 188 H320"/>
  <path class="arrow" d="M544 188 H600"/>
  <path class="arrow" d="M824 188 H880"/>

  <rect class="warm" x="250" y="348" width="620" height="116"/>
  <text class="title" x="278" y="382">Recovery and RL Update</text>
  <text class="small" x="278" y="412">expert correction, sparse reward, value function, advantage-conditioned extraction</text>
  <text class="tiny" x="278" y="438">Bad experience becomes useful when it tells the policy which earlier action caused the later failure.</text>

  <path class="soft" d="M980 248 C980 328 868 368 870 408"/>
  <path class="soft" d="M250 408 C126 408 156 304 156 252"/>
  <path class="arrow" d="M560 348 C560 296 714 300 714 252"/>

  <text class="tiny" x="64" y="296">GR-2, GR-3, GEN-0, Spirit</text>
  <text class="tiny" x="336" y="296">SpatialVLA, DepthVLA, X-VLA</text>
  <text class="tiny" x="620" y="296">Reject impossible tasks early</text>
  <text class="tiny" x="894" y="296">Evaluate closed-loop, not just MSE</text>
</svg>
