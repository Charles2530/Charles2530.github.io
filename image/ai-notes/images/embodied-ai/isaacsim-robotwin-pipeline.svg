<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Sim and RoboTwin pipeline</title>
  <desc id="desc">A diagram showing how assets, annotations, tasks, cuRobo planning, Isaac Sim simulation, success checks, and datasets connect.</desc>
  <rect width="960" height="520" fill="#f7f9fc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f5f9f"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#6b778c;stroke-width:2.4}
      .core{fill:#e7f8ef;stroke:#22a06b;stroke-width:3}
      .task{fill:#fff7e6;stroke:#f59f00;stroke-width:3}
      .sim{fill:#e9f2ff;stroke:#3b82f6;stroke-width:3}
      .data{fill:#f3efff;stroke:#875bf7;stroke-width:3}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#172033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#42526b}
      .line{stroke:#2f5f9f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="38" y="42" class="label">Isaac Sim / RoboTwin style embodied data pipeline</text>
  <g transform="translate(45 82)">
    <rect class="box" x="0" y="0" width="170" height="78" rx="10"/>
    <text x="24" y="31" class="label">assets</text>
    <text x="16" y="56" class="small">OBJ / USD / texture</text>
  </g>
  <g transform="translate(250 82)">
    <rect class="box" x="0" y="0" width="190" height="78" rx="10"/>
    <text x="18" y="31" class="label">annotations</text>
    <text x="15" y="56" class="small">scale, physics, grasp axes</text>
  </g>
  <g transform="translate(485 82)">
    <rect class="task" x="0" y="0" width="178" height="78" rx="10"/>
    <text x="26" y="31" class="label">RoboTwin-like</text>
    <text x="32" y="56" class="small">tasks and resets</text>
  </g>
  <g transform="translate(708 82)">
    <rect class="sim" x="0" y="0" width="190" height="78" rx="10"/>
    <text x="46" y="31" class="label">Isaac Sim</text>
    <text x="18" y="56" class="small">world, physics, sensors</text>
  </g>
  <g transform="translate(170 240)">
    <rect class="core" x="0" y="0" width="190" height="84" rx="10"/>
    <text x="52" y="34" class="label">cuRobo</text>
    <text x="22" y="60" class="small">IK, collision-free plan</text>
  </g>
  <g transform="translate(420 240)">
    <rect class="sim" x="0" y="0" width="190" height="84" rx="10"/>
    <text x="26" y="34" class="label">simulate rollout</text>
    <text x="18" y="60" class="small">actions, cameras, states</text>
  </g>
  <g transform="translate(670 240)">
    <rect class="task" x="0" y="0" width="190" height="84" rx="10"/>
    <text x="28" y="34" class="label">success check</text>
    <text x="22" y="60" class="small">termination / task progress</text>
  </g>
  <g transform="translate(315 395)">
    <rect class="data" x="0" y="0" width="310" height="78" rx="10"/>
    <text x="74" y="31" class="label">training / eval dataset</text>
    <text x="26" y="56" class="small">RGB-D, states, actions, metadata, failure reasons</text>
  </g>
  <path class="line" d="M215 121 L250 121"/>
  <path class="line" d="M440 121 L485 121"/>
  <path class="line" d="M663 121 L708 121"/>
  <path class="line" d="M800 160 C800 212 765 235 720 245"/>
  <path class="line" d="M485 160 C412 194 330 204 280 240"/>
  <path class="line" d="M360 282 L420 282"/>
  <path class="line" d="M610 282 L670 282"/>
  <path class="line" d="M760 324 C760 385 660 418 625 430"/>
  <path class="line" d="M265 324 C265 382 315 414 345 430"/>
  <text x="58" y="205" class="small">RoboTwin-style code defines task families, scene reset, object roles, and annotation conventions.</text>
  <text x="58" y="365" class="small">Isaac Sim validates physics/sensors; planners propose trajectories; success checks decide whether an episode is usable.</text>
</svg>
