<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">RGB-D active depth camera</title>
  <desc id="desc">A depth camera device often has an RGB lens, infrared projector and infrared receiver. It outputs color image, depth image, and point cloud.</desc>
  <rect width="920" height="420" fill="#f7f9fc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f5f9f"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#172033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#42526b}
      .line{stroke:#2f5f9f;stroke-width:3;fill:none}
      .ir{stroke:#875bf7;stroke-width:2;stroke-dasharray:5 6;fill:none}
    </style>
  </defs>
  <g transform="translate(80 135)">
    <rect x="0" y="0" width="300" height="105" rx="20" fill="#263445"/>
    <circle cx="62" cy="52" r="25" fill="#0e1726" stroke="#a7b3c6" stroke-width="4"/>
    <circle cx="62" cy="52" r="10" fill="#67b7dc"/>
    <circle cx="150" cy="52" r="18" fill="#161b22" stroke="#875bf7" stroke-width="4"/>
    <circle cx="238" cy="52" r="25" fill="#0e1726" stroke="#a7b3c6" stroke-width="4"/>
    <circle cx="238" cy="52" r="10" fill="#875bf7"/>
    <text x="22" y="137" class="small">RGB lens</text>
    <text x="108" y="137" class="small">IR projector</text>
    <text x="204" y="137" class="small">IR receiver</text>
    <text x="35" y="-28" class="label">RGB-D / active depth camera</text>
  </g>
  <path d="M230 187 C350 120, 438 100, 520 115" class="ir"/>
  <path d="M318 187 C420 225, 475 220, 530 194" class="ir"/>
  <rect x="520" y="110" width="88" height="88" rx="12" fill="#f59f00" stroke="#b76e00" stroke-width="3"/>
  <text x="508" y="85" class="label">object surface</text>
  <line x1="382" y1="187" x2="640" y2="187" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(675 48)">
    <rect x="0" y="0" width="95" height="75" rx="8" fill="#d8f0ff" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="32" cy="38" r="15" fill="#f59f00"/>
    <text x="2" y="104" class="label">color image</text>
  </g>
  <g transform="translate(675 170)">
    <rect x="0" y="0" width="95" height="75" rx="8" fill="#e7f8ef" stroke="#22a06b" stroke-width="3"/>
    <rect x="16" y="16" width="63" height="43" fill="#a6d8b9"/>
    <text x="0" y="104" class="label">depth image</text>
  </g>
  <g transform="translate(675 292)">
    <rect x="0" y="0" width="95" height="75" rx="8" fill="#fff7e6" stroke="#f59f00" stroke-width="3"/>
    <circle cx="22" cy="28" r="4" fill="#172033"/>
    <circle cx="42" cy="42" r="4" fill="#172033"/>
    <circle cx="70" cy="23" r="4" fill="#172033"/>
    <circle cx="61" cy="54" r="4" fill="#172033"/>
    <text x="-4" y="104" class="label">point cloud</text>
  </g>
  <text x="88" y="330" class="small">The device estimates distance by active IR pattern or time-of-flight, then aligns depth with RGB.</text>
</svg>
