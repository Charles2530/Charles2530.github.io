<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Monocular camera depth ambiguity</title>
  <desc id="desc">A single camera projects near small and far large objects onto the same image ray, making metric depth ambiguous from one image alone.</desc>
  <rect width="920" height="420" fill="#f7f9fc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f5f9f"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#172033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#42526b}
      .line{stroke:#2f5f9f;stroke-width:3;fill:none}
      .dash{stroke:#7a869a;stroke-width:2;stroke-dasharray:6 7;fill:none}
    </style>
  </defs>
  <g transform="translate(70 150)">
    <rect x="0" y="0" width="95" height="72" rx="10" fill="#263445"/>
    <circle cx="68" cy="36" r="23" fill="#0e1726" stroke="#a7b3c6" stroke-width="4"/>
    <circle cx="68" cy="36" r="10" fill="#67b7dc"/>
    <rect x="15" y="-16" width="45" height="16" rx="5" fill="#263445"/>
    <text x="0" y="110" class="label">single RGB camera</text>
  </g>
  <line x1="165" y1="186" x2="520" y2="115" class="line" marker-end="url(#arrow)"/>
  <line x1="165" y1="186" x2="705" y2="78" class="dash"/>
  <line x1="165" y1="186" x2="705" y2="292" class="dash"/>
  <rect x="505" y="91" width="54" height="54" rx="8" fill="#f59f00" stroke="#b76e00" stroke-width="3"/>
  <text x="485" y="72" class="label">small near object</text>
  <rect x="676" y="36" width="112" height="112" rx="12" fill="#22a06b" stroke="#12764d" stroke-width="3"/>
  <text x="655" y="25" class="label">large far object</text>
  <g transform="translate(785 70)">
    <rect x="0" y="0" width="64" height="260" rx="7" fill="#e6ecf5" stroke="#6b778c" stroke-width="3"/>
    <rect x="21" y="76" width="22" height="42" rx="4" fill="#f59f00"/>
    <rect x="21" y="142" width="22" height="42" rx="4" fill="#22a06b"/>
    <text x="-24" y="294" class="label">2D image plane</text>
    <text x="-95" y="325" class="small">same size can be caused by near-small or far-large</text>
  </g>
  <text x="255" y="235" class="label">one image ray cannot decide metric depth</text>
  <text x="255" y="263" class="small">monocular depth needs learned priors, motion, known size, or another sensor</text>
</svg>
