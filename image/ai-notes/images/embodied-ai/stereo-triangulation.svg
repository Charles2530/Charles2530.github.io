<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Stereo camera triangulation</title>
  <desc id="desc">Two calibrated cameras with a baseline observe the same point from different viewpoints. The disparity allows triangulating depth.</desc>
  <rect width="920" height="420" fill="#f7f9fc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f5f9f"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#172033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#42526b}
      .rayL{stroke:#2f5f9f;stroke-width:3;fill:none}
      .rayR{stroke:#de350b;stroke-width:3;fill:none}
      .dash{stroke:#7a869a;stroke-width:2;stroke-dasharray:6 7;fill:none}
    </style>
  </defs>
  <g transform="translate(150 285)">
    <rect x="-48" y="-35" width="96" height="70" rx="10" fill="#263445"/>
    <circle cx="0" cy="0" r="22" fill="#0e1726" stroke="#a7b3c6" stroke-width="4"/>
    <circle cx="0" cy="0" r="9" fill="#67b7dc"/>
    <text x="-58" y="68" class="label">left camera</text>
  </g>
  <g transform="translate(390 285)">
    <rect x="-48" y="-35" width="96" height="70" rx="10" fill="#263445"/>
    <circle cx="0" cy="0" r="22" fill="#0e1726" stroke="#a7b3c6" stroke-width="4"/>
    <circle cx="0" cy="0" r="9" fill="#67b7dc"/>
    <text x="-62" y="68" class="label">right camera</text>
  </g>
  <line x1="150" y1="335" x2="390" y2="335" class="dash"/>
  <text x="236" y="362" class="label">baseline B</text>
  <circle cx="570" cy="110" r="28" fill="#f59f00" stroke="#b76e00" stroke-width="3"/>
  <text x="512" y="62" class="label">3D point</text>
  <line x1="150" y1="285" x2="570" y2="110" class="rayL" marker-end="url(#arrow)"/>
  <line x1="390" y1="285" x2="570" y2="110" class="rayR" marker-end="url(#arrow)"/>
  <g transform="translate(690 82)">
    <rect x="0" y="0" width="70" height="230" rx="7" fill="#e6ecf5" stroke="#6b778c" stroke-width="3"/>
    <circle cx="31" cy="70" r="9" fill="#2f5f9f"/>
    <circle cx="45" cy="70" r="9" fill="#de350b"/>
    <line x1="31" y1="98" x2="45" y2="98" stroke="#172033" stroke-width="3"/>
    <text x="-18" y="263" class="label">image planes</text>
    <text x="-47" y="291" class="small">horizontal shift = disparity d</text>
  </g>
  <text x="104" y="56" class="label">stereo depth: z approx fB / d</text>
  <text x="104" y="84" class="small">same 3D point appears at different pixel positions in left and right images</text>
</svg>
