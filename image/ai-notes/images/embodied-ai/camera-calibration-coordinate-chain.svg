<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Camera calibration coordinate chain</title>
  <desc id="desc">A diagram showing world coordinates, camera coordinates, image plane coordinates and pixel coordinates connected by extrinsics, perspective projection and intrinsics.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 12; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #0f766e; stroke-width: 2; marker-end: url(#arrow); }
      .ray { stroke: #ea580c; stroke-width: 2; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="428" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="46" class="title">Camera Calibration: 从真实世界到像素坐标</text>
  <text x="40" y="74" class="small">外参决定相机在哪里看；内参决定相机如何把 3D 点投到 2D 像素。</text>

  <rect class="box" x="40" y="115" width="190" height="180"/>
  <text x="65" y="150" class="label">World Frame</text>
  <text x="65" y="176" class="small">真实世界 / 机器人基座</text>
  <line class="axis" x1="92" y1="244" x2="152" y2="244"/>
  <line class="axis" x1="92" y1="244" x2="92" y2="184"/>
  <line class="axis" x1="92" y1="244" x2="135" y2="210"/>
  <text x="158" y="249" class="tiny">Xw</text>
  <text x="78" y="181" class="tiny">Yw</text>
  <text x="138" y="208" class="tiny">Zw</text>
  <circle cx="168" cy="188" r="7" fill="#ea580c"/>
  <text x="178" y="193" class="tiny">Pw</text>

  <rect class="box" x="288" y="115" width="190" height="180"/>
  <text x="314" y="150" class="label">Camera Frame</text>
  <text x="314" y="176" class="small">光心为原点</text>
  <text x="314" y="201" class="tiny">Pc = R Pw + t</text>
  <line class="axis" x1="382" y1="247" x2="442" y2="247"/>
  <line class="axis" x1="382" y1="247" x2="382" y2="187"/>
  <line class="axis" x1="382" y1="247" x2="425" y2="213"/>
  <text x="447" y="252" class="tiny">Xc</text>
  <text x="368" y="184" class="tiny">Yc</text>
  <text x="428" y="211" class="tiny">Zc</text>
  <line class="ray" x1="382" y1="247" x2="436" y2="182"/>
  <circle cx="436" cy="182" r="7" fill="#ea580c"/>

  <rect class="box" x="536" y="115" width="190" height="180"/>
  <text x="564" y="150" class="label">Image Plane</text>
  <text x="564" y="176" class="small">毫米坐标 / 归一化坐标</text>
  <text x="564" y="201" class="tiny">x = Xc/Zc, y = Yc/Zc</text>
  <rect x="590" y="222" width="86" height="48" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="636" cy="243" r="6" fill="#ea580c"/>
  <text x="646" y="247" class="tiny">(x, y)</text>

  <rect class="box" x="784" y="115" width="156" height="180"/>
  <text x="814" y="150" class="label">Pixel Frame</text>
  <text x="814" y="176" class="small">图像左上角为原点</text>
  <text x="814" y="201" class="tiny">u = fx x + cx</text>
  <text x="814" y="221" class="tiny">v = fy y + cy</text>
  <rect x="822" y="236" width="82" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="866" cy="255" r="6" fill="#ea580c"/>
  <text x="876" y="259" class="tiny">(u, v)</text>

  <path class="arrow" d="M232 205 C252 205 262 205 286 205"/>
  <text x="242" y="188" class="small">外参 [R|t]</text>
  <text x="246" y="225" class="tiny">world → camera</text>

  <path class="arrow" d="M480 205 C500 205 510 205 534 205"/>
  <text x="487" y="188" class="small">透视投影</text>
  <text x="492" y="225" class="tiny">除以深度 Zc</text>

  <path class="arrow" d="M728 205 C748 205 758 205 782 205"/>
  <text x="741" y="188" class="small">内参 K</text>
  <text x="735" y="225" class="tiny">焦距 + 主点 + 畸变</text>

  <rect x="118" y="330" width="744" height="54" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="145" y="365" class="label">s [u, v, 1]^T = K [R | t] [Xw, Yw, Zw, 1]^T</text>
</svg>
