<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Typical robot camera mounting positions</title>
  <desc id="desc">Robots commonly use fixed external cameras, wrist cameras, and front stereo or RGB-D cameras depending on the task.</desc>
  <rect width="920" height="520" fill="#f7f9fc"/>
  <defs>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#172033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#42526b}
      .beam{stroke:#2f5f9f;stroke-width:2;stroke-dasharray:6 6;fill:rgba(47,95,159,0.08)}
    </style>
  </defs>
  <text x="40" y="42" class="label">common camera mounts on robot systems</text>
  <g transform="translate(55 95)">
    <rect x="0" y="210" width="230" height="18" fill="#a6b1c2"/>
    <rect x="82" y="48" width="75" height="42" rx="8" fill="#263445"/>
    <circle cx="118" cy="69" r="14" fill="#67b7dc" stroke="#e6ecf5" stroke-width="3"/>
    <path d="M118 90 L42 210 L194 210 Z" class="beam"/>
    <rect x="88" y="150" width="50" height="50" rx="6" fill="#f59f00" stroke="#b76e00" stroke-width="3"/>
    <text x="20" y="260" class="label">eye-to-hand / fixed camera</text>
    <text x="8" y="288" class="small">mounted above or beside the workcell</text>
  </g>
  <g transform="translate(360 95)">
    <rect x="72" y="218" width="130" height="18" fill="#a6b1c2"/>
    <circle cx="95" cy="190" r="22" fill="#263445"/>
    <path d="M95 190 L145 140 L185 175 L147 223" stroke="#263445" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="178" y="158" width="52" height="33" rx="7" fill="#263445"/>
    <circle cx="205" cy="175" r="11" fill="#67b7dc" stroke="#e6ecf5" stroke-width="3"/>
    <path d="M205 191 L147 218 L247 218 Z" class="beam"/>
    <rect x="124" y="218" width="36" height="55" rx="5" fill="#f59f00" stroke="#b76e00" stroke-width="3"/>
    <text x="18" y="312" class="label">eye-in-hand / wrist camera</text>
    <text x="18" y="340" class="small">moves with the gripper; good for close contact</text>
  </g>
  <g transform="translate(650 95)">
    <rect x="20" y="168" width="190" height="82" rx="22" fill="#263445"/>
    <rect x="57" y="118" width="115" height="62" rx="13" fill="#3b4658"/>
    <circle cx="82" cy="149" r="13" fill="#67b7dc" stroke="#e6ecf5" stroke-width="3"/>
    <circle cx="148" cy="149" r="13" fill="#67b7dc" stroke="#e6ecf5" stroke-width="3"/>
    <circle cx="55" cy="256" r="24" fill="#172033"/>
    <circle cx="176" cy="256" r="24" fill="#172033"/>
    <path d="M82 149 L15 55 L115 55 Z" class="beam"/>
    <path d="M148 149 L115 55 L215 55 Z" class="beam"/>
    <text x="-8" y="312" class="label">mobile robot front stereo/RGB-D</text>
    <text x="3" y="340" class="small">two lenses or RGB-D module facing forward</text>
  </g>
  <text x="60" y="475" class="small">Fixed cameras see the whole workspace; wrist cameras see the grasp area; front cameras support navigation and obstacle avoidance.</text>
</svg>
