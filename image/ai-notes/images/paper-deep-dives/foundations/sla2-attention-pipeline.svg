<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">SLA2 attention computation pipeline</title>
  <desc id="desc">A schematic of SLA2: a learnable router builds a sparse mask from Q and K, sparse and linear attention branches produce separate outputs, and a learnable ratio mixes them into the final output. The sparse branch can use low-bit attention through quantization-aware training.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <style>
      .frame { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .input { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .router { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.5; rx: 8; }
      .sparse { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; }
      .linear { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .mix { fill: #fdf2f8; stroke: #be185d; stroke-width: 1.5; rx: 8; }
      .output { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; rx: 6; }
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 11px Arial, Helvetica, sans-serif; fill: #475569; }
      .math { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .arrow-amber { stroke: #b45309; stroke-width: 2; fill: none; marker-end: url(#arrow-amber); }
      .arrow-gray { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow-gray); }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect class="frame" x="0" y="0" width="920" height="520"/>
  <text class="title" x="36" y="42">SLA2 attention computation pipeline</text>

  <rect class="panel" x="32" y="70" width="148" height="316"/>
  <text class="label" x="58" y="101">Inputs</text>
  <rect class="input" x="58" y="126" width="96" height="48"/>
  <text class="math" x="98" y="156" text-anchor="middle">Q</text>
  <rect class="input" x="58" y="204" width="96" height="48"/>
  <text class="math" x="98" y="234" text-anchor="middle">K</text>
  <rect class="input" x="58" y="282" width="96" height="48"/>
  <text class="math" x="98" y="312" text-anchor="middle">V</text>

  <rect class="router" x="238" y="128" width="170" height="96"/>
  <text class="label" x="323" y="160" text-anchor="middle">Learnable router</text>
  <text class="math" x="323" y="190" text-anchor="middle">M = R(Q, K)</text>
  <text class="tiny" x="323" y="212" text-anchor="middle">block sparse mask</text>

  <path class="arrow-blue" d="M154,150 C184,150 203,153 235,165"/>
  <path class="arrow-blue" d="M154,228 C184,228 203,212 235,190"/>

  <rect class="sparse" x="482" y="78" width="246" height="154"/>
  <text class="label" x="605" y="108" text-anchor="middle">Sparse attention branch</text>
  <text class="small" x="605" y="135" text-anchor="middle">softmax((QK^T / sqrt(d)) masked by M)</text>
  <rect class="note" x="512" y="154" width="186" height="50"/>
  <text class="small" x="605" y="175" text-anchor="middle">QAT option: low-bit forward</text>
  <text class="tiny" x="605" y="195" text-anchor="middle">quantize Q,K,P,V; dequant output</text>
  <text class="math" x="605" y="222" text-anchor="middle">O_s</text>

  <rect class="linear" x="482" y="284" width="246" height="118"/>
  <text class="label" x="605" y="314" text-anchor="middle">Linear attention branch</text>
  <text class="small" x="605" y="342" text-anchor="middle">uses phi(Q), phi(K), V and 1 - M</text>
  <text class="math" x="605" y="374" text-anchor="middle">O_l</text>

  <path class="arrow-green" d="M408,176 C434,170 450,159 478,154"/>
  <text class="tiny" x="444" y="142" text-anchor="middle">M</text>
  <path class="arrow-amber" d="M408,194 C442,232 450,312 478,340"/>
  <text class="tiny" x="444" y="284" text-anchor="middle">1 - M</text>
  <path class="arrow-blue dash" d="M154,150 C274,64 373,74 478,116"/>
  <path class="arrow-blue dash" d="M154,228 C278,94 370,95 478,128"/>
  <path class="arrow-blue dash" d="M154,306 C275,250 374,198 478,188"/>
  <path class="arrow-amber dash" d="M154,150 C287,414 379,378 478,336"/>
  <path class="arrow-amber dash" d="M154,228 C280,450 380,398 478,350"/>
  <path class="arrow-amber dash" d="M154,306 C280,421 380,399 478,364"/>

  <rect class="mix" x="786" y="187" width="96" height="116"/>
  <text class="label" x="834" y="217" text-anchor="middle">Mix</text>
  <text class="math" x="834" y="247" text-anchor="middle">+</text>
  <text class="tiny" x="834" y="276" text-anchor="middle">weighted sum</text>

  <rect class="mix" x="744" y="78" width="138" height="58"/>
  <text class="small" x="813" y="101" text-anchor="middle">Learnable ratio</text>
  <text class="math" x="813" y="124" text-anchor="middle">alpha</text>

  <path class="arrow-green" d="M728,155 C758,165 770,190 786,220"/>
  <text class="tiny" x="760" y="181" text-anchor="middle">alpha O_s</text>
  <path class="arrow-amber" d="M728,344 C757,330 771,296 786,270"/>
  <text class="tiny" x="752" y="321" text-anchor="middle">(1 - alpha) O_l</text>
  <path class="arrow-gray" d="M813,136 C805,151 805,166 813,184"/>

  <rect class="output" x="786" y="358" width="96" height="58"/>
  <text class="label" x="834" y="383" text-anchor="middle">Output</text>
  <text class="math" x="834" y="405" text-anchor="middle">O</text>
  <path class="arrow-gray" d="M834,303 L834,354"/>

  <text class="small" x="458" y="465" text-anchor="middle">O = alpha * O_s + (1 - alpha) * O_l</text>
  <text class="tiny" x="458" y="488" text-anchor="middle">Schematic redrawn from SLA2 Figure 1 for stable local rendering.</text>
</svg>
