<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Mamba and hybrid Mamba-Transformer architecture</title>
  <desc id="desc">A compact diagram comparing attention blocks, Mamba selective state-space blocks, and hybrid Mamba-Transformer stacks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4a5a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 14; }
      .card { fill: #eef6ff; stroke: #7aa7d9; stroke-width: 1.2; rx: 10; }
      .card2 { fill: #f0fdf4; stroke: #7ac998; stroke-width: 1.2; rx: 10; }
      .card3 { fill: #fff7ed; stroke: #f0a464; stroke-width: 1.2; rx: 10; }
      .card4 { fill: #f5f3ff; stroke: #9b87d9; stroke-width: 1.2; rx: 10; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; font-size: 16px; }
      .small { font-size: 13px; fill: #475569; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; fill: #334155; }
      .arrow { stroke: #3f4a5a; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="520"/>

  <rect class="panel" x="34" y="38" width="276" height="408"/>
  <text class="title" x="58" y="76">Transformer block</text>
  <rect class="card" x="72" y="110" width="200" height="58"/>
  <text class="text" x="112" y="145">Self-attention</text>
  <text class="small" x="86" y="190">Reads pairwise token relations</text>
  <path class="arrow" d="M172 168 L172 220"/>
  <rect class="card" x="72" y="220" width="200" height="58"/>
  <text class="text" x="120" y="255">MLP / FFN</text>
  <text class="small" x="71" y="302">Great retrieval, quadratic prefill, KV cache</text>
  <text class="mono" x="66" y="344">cost ~ O(L^2) prefill</text>
  <text class="mono" x="66" y="369">decode memory ~ O(L)</text>

  <rect class="panel" x="342" y="38" width="276" height="408"/>
  <text class="title" x="370" y="76">Mamba block</text>
  <rect class="card2" x="382" y="108" width="200" height="54"/>
  <text class="text" x="420" y="142">Input projection</text>
  <path class="arrow" d="M482 162 L482 194"/>
  <rect class="card2" x="382" y="194" width="200" height="54"/>
  <text class="text" x="412" y="228">Depthwise conv</text>
  <path class="arrow" d="M482 248 L482 280"/>
  <rect class="card2" x="382" y="280" width="200" height="54"/>
  <text class="text" x="406" y="313">Selective SSM scan</text>
  <path class="arrow" d="M482 334 L482 366"/>
  <rect class="card2" x="382" y="366" width="200" height="54"/>
  <text class="text" x="424" y="400">Gate + output</text>
  <text class="mono" x="368" y="458">h_t = A_t h_{t-1} + B_t x_t</text>
  <text class="mono" x="368" y="480">y_t = C_t h_t</text>

  <rect class="panel" x="650" y="38" width="276" height="408"/>
  <text class="title" x="676" y="76">Hybrid stack</text>
  <rect class="card2" x="688" y="108" width="200" height="48"/>
  <text class="text" x="734" y="138">Mamba layer</text>
  <path class="arrow" d="M788 156 L788 181"/>
  <rect class="card2" x="688" y="181" width="200" height="48"/>
  <text class="text" x="734" y="211">Mamba layer</text>
  <path class="arrow" d="M788 229 L788 254"/>
  <rect class="card" x="688" y="254" width="200" height="48"/>
  <text class="text" x="720" y="284">Attention layer</text>
  <path class="arrow" d="M788 302 L788 327"/>
  <rect class="card3" x="688" y="327" width="200" height="48"/>
  <text class="text" x="735" y="357">MoE / MLP</text>
  <path class="arrow" d="M788 375 L788 400"/>
  <rect class="card4" x="688" y="400" width="200" height="48"/>
  <text class="text" x="726" y="430">Repeat ratio</text>

  <text class="small" x="64" y="492">Attention: precise content routing</text>
  <text class="small" x="364" y="502">Mamba: compact recurrent state</text>
  <text class="small" x="656" y="492">Hybrid: keep some attention, replace many layers with Mamba</text>
</svg>
