<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Decision map for gradient estimators and training signals</title>
  <desc id="desc">A decision map connects continuous random variables, discrete samples, hard operators, and teacher or old distributions to suitable gradient estimators.</desc>
  <rect width="1000" height="560" fill="#fbfaf7"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="500" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">
    Where can the training signal come from?
  </text>
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">
    First identify what breaks the ordinary chain rule.
  </text>

  <g transform="translate(274,86)">
    <rect x="0" y="0" width="452" height="82" rx="6" fill="#ffffff" stroke="#94a3b8" filter="url(#soft-shadow)"/>
    <text x="226" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">
      What happened in the forward path?
    </text>
    <text x="226" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">
      sampling, a hard operator, or data from another model/distribution
    </text>
  </g>

  <path d="M500,168 L500,202 L176,202 L176,232" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500,168 L500,202 L392,202 L392,232" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500,168 L500,202 L608,202 L608,232" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M500,168 L500,202 L824,202 L824,232" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70,232)">
    <rect x="0" y="0" width="212" height="184" rx="6" fill="#eff6ff" stroke="#60a5fa" filter="url(#soft-shadow)"/>
    <text x="106" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">
      Continuous sample
    </text>
    <text x="106" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      parameters + independent noise
    </text>
    <line x1="25" y1="70" x2="187" y2="70" stroke="#bfdbfe"/>
    <text x="106" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">
      Reparameterization
    </text>
    <text x="106" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">
      pathwise gradient
    </text>
    <text x="106" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      VAE, Gaussian RSSM
    </text>
  </g>

  <g transform="translate(286,232)">
    <rect x="0" y="0" width="212" height="184" rx="6" fill="#ecfdf5" stroke="#34d399" filter="url(#soft-shadow)"/>
    <text x="106" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">
      Discrete sample
    </text>
    <text x="106" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      sample choice blocks derivatives
    </text>
    <line x1="25" y1="70" x2="187" y2="70" stroke="#a7f3d0"/>
    <text x="106" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">
      Score-function
    </text>
    <text x="106" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">
      or Gumbel relaxation
    </text>
    <text x="106" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      REINFORCE, categorical latent
    </text>
  </g>

  <g transform="translate(502,232)">
    <rect x="0" y="0" width="212" height="184" rx="6" fill="#fff7ed" stroke="#fb923c" filter="url(#soft-shadow)"/>
    <text x="106" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#c2410c">
      Hard operator
    </text>
    <text x="106" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      round, argmax, hard mask
    </text>
    <line x1="25" y1="70" x2="187" y2="70" stroke="#fed7aa"/>
    <text x="106" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">
      Straight-through
    </text>
    <text x="106" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">
      surrogate backward
    </text>
    <text x="106" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      QAT, DreamerV2
    </text>
  </g>

  <g transform="translate(718,232)">
    <rect x="0" y="0" width="212" height="184" rx="6" fill="#fefce8" stroke="#eab308" filter="url(#soft-shadow)"/>
    <text x="106" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#a16207">
      Another source
    </text>
    <text x="106" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      teacher or old distribution
    </text>
    <line x1="25" y1="70" x2="187" y2="70" stroke="#fde68a"/>
    <text x="106" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#854d0e">
      Stop-gradient / EMA
    </text>
    <text x="106" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#854d0e">
      importance weighting
    </text>
    <text x="106" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      JEPA, PPO, off-policy data
    </text>
  </g>

  <g transform="translate(146,452)">
    <rect x="0" y="0" width="708" height="64" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="354" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">
      No estimator is free: always check bias, variance, support, and forward/backward mismatch.
    </text>
    <text x="354" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
      The right question is not only "can gradients flow?" but "what objective does this gradient estimate?"
    </text>
  </g>
</svg>
