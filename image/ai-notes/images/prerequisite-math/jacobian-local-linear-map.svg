<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jacobian as a local linear map</title>
  <desc id="desc">A small input perturbation is transformed by the local Jacobian into a rotated and rescaled output perturbation.</desc>
  <rect width="960" height="420" fill="#fbfaf7"/>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">
    Jacobian: the local map from an input perturbation to an output perturbation
  </text>

  <g transform="translate(38,74)">
    <rect x="0" y="0" width="244" height="252" rx="6" fill="#ffffff" stroke="#d6d3d1" filter="url(#soft-shadow)"/>
    <text x="122" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb">
      Input space
    </text>
    <text x="122" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      a small change around x
    </text>

    <line x1="42" y1="179" x2="205" y2="179" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="103" y1="221" x2="103" y2="82" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="103" cy="179" r="5" fill="#334155"/>
    <line x1="103" y1="179" x2="171" y2="119" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="169" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">
      delta x
    </text>
    <text x="112" y="198" font-family="Arial, sans-serif" font-size="12" fill="#334155">x</text>
    <text x="208" y="194" font-family="Arial, sans-serif" font-size="11" fill="#64748b">x1</text>
    <text x="111" y="82" font-family="Arial, sans-serif" font-size="11" fill="#64748b">x2</text>
  </g>

  <line x1="292" y1="200" x2="348" y2="200" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <g transform="translate(358,112)">
    <rect x="0" y="0" width="244" height="176" rx="6" fill="#ecfdf5" stroke="#5eead4" filter="url(#soft-shadow)"/>
    <text x="122" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">
      Local linear map
    </text>
    <text x="122" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2937">
      J_f(x)
    </text>
    <text x="122" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">
      rotation + stretching + compression
    </text>
    <text x="122" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">
      delta y is approximately J_f(x) delta x
    </text>
    <text x="122" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
      valid near the current point x
    </text>
  </g>

  <line x1="612" y1="200" x2="668" y2="200" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-coral)"/>

  <g transform="translate(678,74)">
    <rect x="0" y="0" width="244" height="252" rx="6" fill="#ffffff" stroke="#d6d3d1" filter="url(#soft-shadow)"/>
    <text x="122" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c2410c">
      Output space
    </text>
    <text x="122" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      direction and scale both changed
    </text>

    <ellipse cx="111" cy="175" rx="78" ry="35" transform="rotate(-22 111 175)" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <line x1="39" y1="179" x2="207" y2="179" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="101" y1="222" x2="101" y2="79" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="101" cy="179" r="5" fill="#334155"/>
    <line x1="101" y1="179" x2="184" y2="105" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-coral)"/>
    <text x="183" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">
      delta y
    </text>
    <text x="110" y="198" font-family="Arial, sans-serif" font-size="12" fill="#334155">f(x)</text>
    <text x="210" y="194" font-family="Arial, sans-serif" font-size="11" fill="#64748b">y1</text>
    <text x="109" y="79" font-family="Arial, sans-serif" font-size="11" fill="#64748b">y2</text>
  </g>

  <text x="480" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">
    Local rule: a nonlinear map behaves like its Jacobian for a sufficiently small perturbation.
  </text>
  <text x="480" y="399" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    The Jacobian depends on the current point: move far away, and the local map must be recomputed.
  </text>
</svg>
