<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fisher information as local KL curvature</title>
  <desc id="desc">The same parameter-space step can cause a small or large distribution change depending on the Fisher information along that direction.</desc>
  <rect width="760" height="360" fill="#fbfaf7"/>

  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">
    Fisher information: sensitivity of a model distribution to parameter movement
  </text>

  <g transform="translate(54,76)">
    <rect x="0" y="0" width="296" height="230" rx="10" fill="#ffffff" stroke="#d6d3d1" filter="url(#soft-shadow)"/>
    <text x="148" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">
      Low-Fisher direction
    </text>
    <text x="148" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      same parameter step, small KL change
    </text>

    <ellipse cx="148" cy="127" rx="92" ry="28" fill="none" stroke="#99f6e4" stroke-width="3"/>
    <ellipse cx="148" cy="127" rx="62" ry="19" fill="none" stroke="#5eead4" stroke-width="3"/>
    <ellipse cx="148" cy="127" rx="31" ry="10" fill="none" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="148" cy="127" r="5" fill="#0f766e"/>

    <line x1="148" y1="127" x2="219" y2="127" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <text x="184" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f766e">
      same |delta theta|
    </text>
    <text x="148" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">
      u^T F u is small
    </text>
  </g>

  <g transform="translate(410,76)">
    <rect x="0" y="0" width="296" height="230" rx="10" fill="#ffffff" stroke="#d6d3d1" filter="url(#soft-shadow)"/>
    <text x="148" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c2410c">
      High-Fisher direction
    </text>
    <text x="148" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      same parameter step, large KL change
    </text>

    <ellipse cx="148" cy="127" rx="36" ry="89" fill="none" stroke="#fed7aa" stroke-width="3"/>
    <ellipse cx="148" cy="127" rx="24" ry="61" fill="none" stroke="#fdba74" stroke-width="3"/>
    <ellipse cx="148" cy="127" rx="12" ry="31" fill="none" stroke="#f97316" stroke-width="3"/>
    <circle cx="148" cy="127" r="5" fill="#c2410c"/>

    <line x1="148" y1="127" x2="219" y2="127" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <text x="184" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">
      same |delta theta|
    </text>
    <text x="148" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">
      u^T F u is large
    </text>
  </g>

  <text x="380" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">
    Local rule: D_KL(p_theta || p_{theta + delta}) is approximately 1/2 delta^T F delta
  </text>
</svg>
